<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login – St. Francis School Deoghar</title>
<link rel="stylesheet" href="style.css"/>
<link rel="icon" href="PICS/LOGO.jpg" type="image/jpeg"/>
<style>
body { background: linear-gradient(135deg, var(--navy) 0%, #1a2d6b 50%, #0d1b3e 100%); min-height: 100vh; display: flex; flex-direction: column; }
.login-page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 100px 20px 40px; position: relative; overflow: hidden; }
.login-page::before { content: ''; position: absolute; width: 600px; height: 600px; border-radius: 50%; background: rgba(201,168,76,0.04); top: -200px; right: -200px; }
.login-page::after { content: ''; position: absolute; width: 400px; height: 400px; border-radius: 50%; background: rgba(201,168,76,0.04); bottom: -150px; left: -150px; }
.login-container { position: relative; z-index: 2; width: 100%; max-width: 460px; }
.login-logo { text-align: center; margin-bottom: 32px; }
.login-logo img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--gold); box-shadow: 0 0 30px rgba(201,168,76,0.3); margin-bottom: 16px; }
.login-logo h1 { font-size: 1.5rem; color: var(--white); margin-bottom: 4px; }
.login-logo p { color: var(--gold); font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; }
.role-tabs { display: flex; background: rgba(255,255,255,0.06); border-radius: 12px; padding: 4px; margin-bottom: 28px; border: 1px solid rgba(201,168,76,0.15); }
.role-tab { flex: 1; padding: 10px 6px; text-align: center; border-radius: 9px; font-size: 0.78rem; font-weight: 600; color: rgba(255,255,255,0.55); cursor: pointer; transition: var(--transition); }
.role-tab.active { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--navy); }
.login-card { background: rgba(255,255,255,0.07); backdrop-filter: blur(20px); border: 1px solid rgba(201,168,76,0.2); border-radius: var(--radius-lg); padding: 36px; }
.login-card h2 { color: var(--white); font-size: 1.4rem; margin-bottom: 6px; }
.login-card .subtitle { color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-bottom: 28px; }
.input-group { position: relative; margin-bottom: 20px; }
.input-group label { display: block; color: rgba(255,255,255,0.75); font-size: 0.82rem; font-weight: 500; margin-bottom: 8px; }
.input-group input { width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(201,168,76,0.2); border-radius: 10px; padding: 13px 16px; color: var(--white); font-size: 0.9rem; font-family: 'Inter', sans-serif; transition: var(--transition); }
.input-group input::placeholder { color: rgba(255,255,255,0.3); }
.input-group input:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,0.12); box-shadow: 0 0 0 3px rgba(201,168,76,0.1); }
.hint { font-size: 0.75rem; color: rgba(255,255,255,0.35); margin-top: 4px; }
.btn-login-submit { width: 100%; padding: 14px; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--navy); font-weight: 700; font-size: 1rem; cursor: pointer; transition: var(--transition); margin-top: 8px; }
.btn-login-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,168,76,0.4); }
.back-link { text-align: center; margin-top: 20px; }
.back-link a { color: rgba(255,255,255,0.5); font-size: 0.85rem; transition: var(--transition); }
.back-link a:hover { color: var(--gold); }
.error-msg { background: rgba(192,57,43,0.15); border: 1px solid rgba(192,57,43,0.4); border-radius: 8px; padding: 10px 14px; color: #ff6b6b; font-size: 0.85rem; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<nav class="navbar">
  <div class="brand">
    <img src="PICS/LOGO.jpg" alt="Logo"/>
    <div class="brand-text">
      <div class="name">ST. FRANCIS SCHOOL</div>
      <div class="sub">— Deoghar —</div>
    </div>
  </div>
  <div class="nav-links"><a href="index.html">← Back to Home</a></div>
</nav>

<div class="login-page">
  <div class="login-container">
    <div class="login-logo">
      <img src="PICS/LOGO.jpg" alt="St. Francis School Logo"/>
      <h1>School Portal Login</h1>
      <p>St. Francis School • Deoghar</p>
    </div>
    <div class="role-tabs">
      <div class="role-tab active" onclick="setRole('admin')" id="tab-admin">🔑 Admin</div>
      <div class="role-tab" onclick="setRole('teacher')" id="tab-teacher">👨‍🏫 Teacher</div>
      <div class="role-tab" onclick="setRole('student')" id="tab-student">🎓 Student</div>
    </div>
    <div class="login-card">
      <h2 id="roleTitle">Administrator Login</h2>
      <div class="subtitle" id="roleSubtitle">Enter your admin credentials to access the dashboard</div>
      <div class="error-msg" id="errorMsg">Invalid username or password. Please try again.</div>
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username"/>
        <div class="hint" id="hintUser">Hint: ADMIN</div>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password"/>
        <div class="hint" id="hintPass">Hint: 0000</div>
      </div>
      <button class="btn-login-submit" onclick="doLogin()">Login →</button>
    </div>
    <div class="back-link"><a href="index.html">← Return to Main Website</a></div>
  </div>
</div>

<script>
let currentRole = 'admin';

const roles = {
  admin:   { title:'Administrator Login', sub:'Enter your admin credentials to access the dashboard', hintU:'Hint: ADMIN', hintP:'Hint: 0000' },
  teacher: { title:'Teacher Login', sub:'Mr. Tapan → TAPAN | Mr. Vaskar → VASKAR  |  Password: 1111', hintU:'TAPAN or VASKAR', hintP:'Hint: 1111' },
  student: { title:'Student Login', sub:'Username: ARSH / SAMYAK / TEJAS  |  Password: 1234', hintU:'ARSH / SAMYAK / TEJAS', hintP:'Hint: 1234' }
};

const STUDENT_MAP = {
  arsh:   { id:'arsh',   name:'Arsh Raj',     roll:'13', admNo:'12345', cls:'Class X – A' },
  samyak: { id:'samyak', name:'Samyak Mishra', roll:'23', admNo:'5678',  cls:'Class X – A' },
  tejas:  { id:'tejas',  name:'Tejas Vinayak', roll:'43', admNo:'8765',  cls:'Class X – A' }
};

function setRole(r){
  currentRole = r;
  document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+r).classList.add('active');
  const d = roles[r];
  document.getElementById('roleTitle').textContent = d.title;
  document.getElementById('roleSubtitle').textContent = d.sub;
  document.getElementById('hintUser').textContent = d.hintU;
  document.getElementById('hintPass').textContent = d.hintP;
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
  document.getElementById('errorMsg').style.display = 'none';
}

function doLogin(){
  const u = document.getElementById('username').value.trim().toUpperCase();
  const p = document.getElementById('password').value.trim();
  document.getElementById('errorMsg').style.display = 'none';

  if(currentRole === 'admin'){
    if(u === 'ADMIN' && p === '0000'){
      sessionStorage.setItem('sfs_role','admin');
      window.location.href = 'admin.html';
    } else { document.getElementById('errorMsg').style.display='block'; }
  }
  else if(currentRole === 'teacher'){
    const tMap = { TAPAN:'Mr. Tapan', VASKAR:'Mr. Vaskar' };
    if(tMap[u] && p === '1111'){
      sessionStorage.setItem('sfs_role','teacher');
      sessionStorage.setItem('sfs_teacher_name', tMap[u]);
      window.location.href = 'teacher.html';
    } else { document.getElementById('errorMsg').style.display='block'; }
  }
  else if(currentRole === 'student'){
    const key = u.toLowerCase();
    if(STUDENT_MAP[key] && p === '1234'){
      sessionStorage.setItem('sfs_role','student');
      sessionStorage.setItem('sfs_student_id', key);
      window.location.href = 'parent.html';
    } else { document.getElementById('errorMsg').style.display='block'; }
  }
}
document.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
